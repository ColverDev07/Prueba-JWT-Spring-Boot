version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8081:8080" #[Puerto del PC] : [Puerto del contenedor]
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/demo_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - app-net

  db:
    image: postgres:16
    container_name: postgres-jwt
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app-net
networks:
  app-net:
volumes:
  pgdata:




